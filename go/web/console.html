<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 翻译席 · 操作员控制台</title>
<style>
  :root{ --bg:#14161a; --panel:#1d2027; --line:#2b303b; --txt:#e6e8eb; --dim:#8b93a1;
         --accent:#4c8dff; --green:#3fb950; --yellow:#d29922; --red:#f85149; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column}
  header{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
  header h1{font-size:16px;font-weight:600}
  .sp{flex:1}
  button{background:#262b34;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{background:var(--red);border-color:var(--red);color:#fff}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);display:inline-block}
  .dot.ok{background:var(--green)} .dot.warn{background:var(--yellow)} .dot.bad{background:var(--red)}
  main{flex:1;display:grid;grid-template-columns:1fr 320px 1.1fr;gap:1px;background:var(--line);overflow:hidden}
  .col{background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
  .col h2{font-size:13px;color:var(--dim);padding:10px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;text-transform:uppercase;letter-spacing:.05em}
  .scroll{flex:1;overflow-y:auto;padding:10px 12px}
  /* 转写 */
  .seg{padding:6px 8px;border-radius:6px;margin-bottom:6px;font-size:14px;line-height:1.55;cursor:text}
  .seg.partial{color:var(--dim);font-style:italic}
  .seg.final{color:var(--txt);background:#22262e}
  .seg .t{color:#5b6270;font-size:11px;margin-right:6px;font-family:monospace}
  .seg.editing{outline:1px solid var(--accent)}
  /* 修正高亮：asr 回退纠错=黄，llm 顺句改写=蓝，1.5s 后淡出 */
  .seg.revised-asr{background:#3a3116;transition:background .6s}
  .seg.revised-llm{background:#16283a;transition:background .6s}
  /* 术语 */
  .term{padding:6px 9px;background:#262b34;border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between}
  .term:hover{border:1px solid var(--accent)}
  .term .s{color:var(--dim);font-size:11px}
  .tasks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .task{text-align:left;padding:9px;font-size:13px;line-height:1.3}
  .task small{display:block;color:var(--dim);font-weight:400;margin-top:2px}
  input[type=text]{width:100%;background:#14161a;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:8px}
  /* AI 卡 */
  #aiCard{background:#14161a;border:1px solid var(--line);border-radius:8px;padding:14px;min-height:180px;font-size:15px;line-height:1.7;white-space:pre-wrap}
  #aiCard .state{color:var(--dim);font-style:italic}
  #aiCard[contenteditable="true"]{cursor:text}
  #aiCard[contenteditable="true"]:hover{border-color:var(--dim)}
  #aiCard[contenteditable="true"]:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  .checks{font-size:11px;color:var(--dim);margin-top:8px;font-family:monospace}
  .actions{display:flex;gap:8px;margin-top:10px}
  footer{height:34px;display:flex;align-items:center;gap:14px;padding:0 16px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);flex:0 0 auto}
  .capcheck{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);cursor:pointer;white-space:nowrap}
  .capcheck input{cursor:pointer}
</style>
</head>
<body>
<!-- 脚本异常兜底：任何未捕获的 JS 错误都在页面底部显示，避免「点了没反应」却无从定位 -->
<div id="errBar" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:99;background:#5a1d1d;color:#ffd7d7;font-size:12px;padding:6px 12px;border-top:1px solid #f85149"></div>
<header>
  <h1>AI 跨学科实时翻译席 · 控制台</h1>
  <!-- 姓名/机构输入框已下线：热词改由「解析讲稿」生成（上传演示稿 → 抽词 + 摘要），不再依赖报告人信息 -->
  <label class="capcheck" title="勾选＝用浏览器麦克风采音，经 WebSocket 推给服务器识别（远端/服务器无声卡时用）；不勾选＝用服务器本机声卡。改动在下次点「开始 Session」时生效。"><input type="checkbox" id="capBrowser" checked>浏览器收音</label>
  <button id="btnSession" class="primary">开始 Session</button>
  <button id="btnMicStop" class="danger" style="display:none" title="关闭浏览器麦克风采集（服务端流水线继续运行，可用「开始 Session」重新开启）">停止收音</button>
  <button id="btnKill" class="danger">急停 (Esc)</button>
  <span class="sp"></span>
  <span><span class="dot" id="asrDot"></span> ASR</span>
  <span><span class="dot" id="llmDot"></span> LLM</span>
  <span id="stateLabel">IDLE</span>
</header>
<main>
  <div class="col">
    <h2>实时转写</h2>
    <div class="scroll" id="transcript"></div>
  </div>
  <div class="col">
    <h2>任务 · 候选术语</h2>
    <div class="scroll">
      <div class="tasks">
        <button class="task" data-task="TERM">1 术语翻译<small>解释目标术语</small></button>
        <button class="task" data-task="Q_TRANSLATE">2 问题转译<small>转译专业问题</small></button>
        <button class="task" data-task="A_TRANSLATE">3 回答转译<small>通俗转述回答</small></button>
        <button class="task" data-task="BRIDGE">4 桥接提问<small>跨学科连接</small></button>
        <button class="task" data-task="SUMMARY">5 报告总结<small>通俗总结</small></button>
      </div>
      <input type="text" id="targetDiscipline" placeholder="目标学科（默认「白话」，即讲给非专业听众）" title="把 AI 输出翻译到该学科的表达层次：可直接输入自定义学科，回车或失焦生效；留空按「白话」处理。与「报告人学科」不同，这里指的是「讲给谁听」。">
      <input type="text" id="target" placeholder="目标术语/问题（可选）">
      <h2 style="padding:6px 0 8px;border:none">候选术语（点击即解释）</h2>
      <div id="terms"></div>
    </div>
  </div>
  <div class="col">
    <h2>AI 输出卡</h2>
    <div class="scroll">
      <div id="aiCard"><span class="state">等待生成…</span></div>
      <div class="checks" id="checks"></div>
      <div class="actions">
        <button id="btnShow" class="primary">投屏展示 (Enter)</button>
        <button id="btnDiscard">丢弃 (Backspace)</button>
        <button id="btnRegen">重生成 (R)</button>
      </div>
      <h2 style="padding:12px 0 6px;border:none">热词 <label class="capcheck" style="margin-left:8px" title="关闭后 ASR 调用不携带任何热词"><input type="checkbox" id="hwEnabled" checked>参与 ASR 识别</label></h2>
      <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
        <input type="file" id="docFile" accept=".pptx,.ppt,.pdf,.docx,.doc,.md,.txt,.rtf" title="支持 PPT / PDF / Word / Markdown 等。上传后自动解析正文 → 抽取热词 → 生成 AI 翻译用的背景摘要。" style="flex:1;min-width:0;font-size:12px;color:var(--dim)">
        <button id="docUpload" title="上传演示稿：解析正文 → 抽取热词（即时用于 ASR）+ 生成浓缩摘要（作为每次 AI 调用的背景）">解析讲稿</button>
      </div>
      <textarea id="hwText" rows="5" placeholder="每行一个热词，可附权重（词 60 或 词,60）；保存后即时生效" style="width:100%;background:#14161a;border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:8px;font-size:13px;font-family:inherit;line-height:1.5;resize:vertical"></textarea>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
        <button id="hwSave" class="primary">保存热词</button>
        <span id="hwStatus" style="font-size:12px;color:var(--dim)"></span>
      </div>
    </div>
  </div>
</main>
<footer>
  <span id="asrStatus">ASR: -</span>
  <span id="llmStatus">LLM: -</span>
  <span id="micStatus">收音: -</span>
  <span id="sessionInfo">未开始</span>
  <span class="sp"></span>
  <span id="callCount">调用 0 次</span>
</footer>
<script>
const $=id=>document.getElementById(id);
// 部署可能挂在路径前缀下（如腾讯云 Kong 网关的 base path /conf）。
// 页面固定是 <前缀>/console 或 <前缀>/screen，从 pathname 反推前缀 —— 根路径部署时为空串。
// 所有接口/WS 调用都必须带上它：绝对路径 /api/x 在 /conf/console 页面里会被浏览器
// 解析成 /api/x（前缀丢失），即使 Kong 配了 strip_path 也回不到后端。
const BASE=location.pathname.replace(/\/(console|screen)\/?$/,"").replace(/\/+$/,"");
let ws, sid=null, curInv=null, curTask=null, curText="", callCount=0;
// 未捕获异常不再静默：底部横幅提示（元素缺失/接口报错都会立刻可见）
window.onerror=(msg,src,line)=>{ const b=$("errBar"); if(b){ b.style.display=""; b.textContent="页面脚本错误："+msg+"（第 "+line+" 行）— 请截图反馈"; } return false; };

function connect(){
  // 协议自适应：页面走 https 时必须用 wss，否则浏览器直接拒绝连接（前置 TLS 网关时踩）
  const scheme=location.protocol==="https:"?"wss://":"ws://";
  ws=new WebSocket(scheme+location.host+BASE+"/ws/console");
  ws.onopen=()=>console.log("ws open");
  ws.onmessage=e=>{ const m=JSON.parse(e.data); handle(m); };
  ws.onclose=()=>setTimeout(connect,1000);
}
// 立即建连：函数声明已提升，handle 等在收到消息时（下一个事件循环）才被调用，此时脚本早已执行完。
// 放在这里而不是脚本末尾 —— 后面任何一处事件绑定抛错都不该连带掐断转写通道。
connect();
function post(path,body){ return fetch(BASE+path,{method:"POST",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):"{}"}).then(r=>r.json()); }

function handle(m){
  switch(m.type){
    case "TRANSCRIPT_PARTIAL": draftSeg(m.text); break;
    case "TRANSCRIPT_FINAL": finalSeg(m.seg_id,m.text); break;
    case "TRANSCRIPT_REVISED": reviseSeg(m.seg_id,m.text,m.source); break;
    case "TERM_CANDIDATES": renderTerms(m.items); break;
    case "AI_STATE":
      $("stateLabel").textContent=m.state;
      if(m.state==="GENERATING"){ curInv=m.invocation_id; curTask=m.task; curText=""; $("aiCard").innerHTML="<span class='state'>生成中…</span>"; $("aiCard").contentEditable="false"; $("checks").textContent=""; }
      if(m.state==="IDLE" && m.error){
        let html=`<span style="color:var(--red)">${m.error}</span>`;
        if(m.raw_text){ html+=`<div style="margin-top:10px;color:var(--dim);font-size:13px">模型原文（未通过校验，请人工判断）：</div><div style="margin-top:4px">${m.raw_text}</div>`; }
        $("aiCard").innerHTML=html; $("aiCard").contentEditable="false";
      }
      break;
    case "AI_DELTA": if(m.invocation_id===curInv){ curText+=m.delta; $("aiCard").textContent=curText; } break;
    case "AI_READY":
      curInv=m.invocation_id; curText=m.text; curTask=m.task;
      $("aiCard").textContent=m.text;
      $("aiCard").contentEditable="true"; $("aiCard").dataset.text=m.text;  // 生成完成后允许人工编辑
      $("checks").textContent="字数="+m.chars+" 约"+m.est_sec+"s | "+JSON.stringify(m.checks);
      break;
    case "AI_SHOWING": $("stateLabel").textContent="SHOWING"; break;
    case "AI_KILLED":
      $("stateLabel").textContent="IDLE"; $("aiCard").innerHTML="<span class='state'>已急停</span>"; $("aiCard").contentEditable="false";
      // 同上：急停后卡片是状态占位文本，清掉 curInv 防止误投屏；
      // 想继续用直接按任务键，想重生成按 R（curTask 仍保留）
      curInv=null; curText="";
      break;
    case "ASR_STATUS":
      $("asrStatus").textContent="ASR:"+m.status;
      $("asrDot").className="dot "+(m.status==="connected"||m.status.startsWith("event:")?"ok":"warn");
      break;
    case "MIC_STATUS":
      $("micStatus").textContent="收音:"+(m.status==="connected"?"采集中（浏览器）":"等待连接");
      break;
    case "HOTWORDS_STATUS":
      const hw=m.status;
      if(hw==="generating"){ $("sessionInfo").textContent="正在重新生成热词…"; $("hwStatus").textContent="生成中…"; }
      else if(hw.startsWith("generated:")){ $("sessionInfo").textContent="热词已重新生成："+hw.slice("generated:".length)+" 个";
        $("hwStatus").textContent="生成完成："+hw.slice("generated:".length)+" 个";
        if(document.activeElement!==$("hwText")) loadHotwords(); }   // 编辑中不覆盖输入
      else if(hw.startsWith("failed:")){ $("sessionInfo").textContent="热词生成失败："+hw.slice("failed:".length); $("hwStatus").textContent="生成失败"; }
      // skipped:no_speaker 现在是正常情况（姓名框已下线，热词改由「解析讲稿」生成），不再提示
      else if(hw==="skipped:llm_unavailable"){ $("sessionInfo").textContent="LLM 未配置，跳过热词生成"; }
      break;
    case "SESSION": sid=m.session_id; $("sessionInfo").textContent=m.title+" · "+m.session_id; break;
  }
}
function draftSeg(text){
  // 当前句草稿（灰色斜体），随 partial 持续更新
  let el=document.getElementById("seg-draft");
  if(!text){
    if(el) el.remove();
    return;
  }
  if(!el){ el=document.createElement("div"); el.className="seg partial"; el.id="seg-draft"; $("transcript").appendChild(el); }
  el.textContent=text;
  $("transcript").scrollTop=$("transcript").scrollHeight;
}
function finalSeg(id,text){
  // 已确认终稿（黑色），每条独立，可点击修正
  let el=document.getElementById("seg-"+id);
  if(!el){ el=document.createElement("div"); el.className="seg final"; el.id="seg-"+id; el.contentEditable="true";
    el.addEventListener("blur",()=>{ if(el.dataset.text!==el.innerText){ fetch(`${BASE}/api/segment/${id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:el.innerText})}); el.dataset.text=el.innerText; }});
    $("transcript").appendChild(el); }
  el.dataset.text=text; el.textContent=text;
  // 终稿确认后清空草稿行
  const d=document.getElementById("seg-draft"); if(d) d.remove();
  $("transcript").scrollTop=$("transcript").scrollHeight;
}
function reviseSeg(id,text,source){
  // 回退修正：服务端纠错或 LLM 顺句改写后，覆盖更新已显示的句子
  const el=document.getElementById("seg-"+id);
  if(!el) return;
  if(document.activeElement===el) return;   // 正在人工编辑则不覆盖
  el.dataset.text=text; el.textContent=text;
  el.classList.add(source==="llm"?"revised-llm":"revised-asr");
  setTimeout(()=>el.classList.remove("revised-llm","revised-asr"),1500);
}
function renderTerms(items){
  $("terms").innerHTML="";
  items.forEach(it=>{ const d=document.createElement("div"); d.className="term";
    d.innerHTML=`<span>${it.term}</span><span class="s">${it.score.toFixed(2)}</span>`;
    d.onclick=()=>{ $("target").value=it.term; invoke("TERM",it.term); };
    $("terms").appendChild(d); });
}
async function invoke(task,target){
  if(!sid){ alert("请先开始 Session"); return; }
  curTask=task; callCount++; $("callCount").textContent="调用 "+callCount+" 次";
  await post("/api/invoke",{task,target:target||$("target").value||null});
}
async function startSession(){
  // 元素缺失一律降级为默认值：任何一处取不到都不能让整个启动流程中断（否则会永久停在「启动中…」）
  const el=id=>$(id);
  // 姓名/机构已下线：热词改由「解析讲稿」生成，不再依赖报告人信息。
  // 接口仍接受这两个字段，传空串即跳过按人生成（服务端会标记 skipped:no_speaker）。
  // 「浏览器收音」开关决定音源：勾选＝浏览器采音；不勾选＝服务器本机声卡
  const capture=(el("capBrowser")&&el("capBrowser").checked)?"browser":"mic";
  const td=el("targetDiscipline");
  const targetDiscipline=(td&&td.value.trim())?td.value.trim():"白话";
  $("sessionInfo").textContent="启动中…";
  try{
    const r=await post("/api/session",{title:"Workshop",speaker:"",institution:"",discipline:"",target_discipline:targetDiscipline,ai_enabled:true,capture});
    if(!r.pipeline||!r.pipeline.ok){
      $("sessionInfo").textContent="启动失败："+((r.pipeline&&r.pipeline.msg)||"服务端未返回流水线信息");
      alert("音频采集失败："+(r.pipeline&&r.pipeline.msg));
      return;
    }
    sid=r.session_id;   // 直接取响应里的 id，不等 WS 的 SESSION 事件（否则自动开麦时 sid 可能还是空）
    let info=r.session_id;
    // 以服务端**实际生效**的音源为准：本机声卡打开失败时服务端会自动降级为 browser，
    // 这时也必须把浏览器麦克风打开，否则没有音频进来。
    if(r.pipeline.capture==="browser"){
      info+=" · 浏览器收音";
      const ok=await startMic();
      info+=ok?"（麦克风已开启）":"（麦克风未开启，见下方提示）";
    }else{
      info+=" · 服务器本机麦克风";
    }
    if(r.pipeline.note) info+=" · "+r.pipeline.note;
    $("sessionInfo").textContent=info;
  }catch(e){
    // 网络失败 / 返回非 JSON / 服务端 500：必须给出可见反馈，不能停在「启动中…」
    $("sessionInfo").textContent="启动失败："+e.message+"（服务端是否已启动？看 seat.log）";
    console.error("startSession failed",e);
  }
}
// 事件绑定
document.querySelectorAll(".task").forEach(b=>b.onclick=()=>invoke(b.dataset.task));
$("btnSession").onclick=startSession;
$("btnKill").onclick=()=>{ post("/api/kill"); $("stateLabel").textContent="IDLE"; };
$("btnShow").onclick=()=>curInv&&post(`/api/invocation/${curInv}/show`,{text:$("aiCard").innerText.trim()||null});  // 投屏带编辑后文本
$("btnDiscard").onclick=()=>curInv&&post(`/api/invocation/${curInv}/discard`);
$("btnRegen").onclick=()=>curTask&&invoke(curTask,$("target").value||null);
// AI 输出卡编辑：失焦即保存；若正在投屏，大屏实时同步（PATCH 内部处理）
$("aiCard").addEventListener("blur",()=>{
  const el=$("aiCard"), t=el.innerText.trim();
  if(curInv && t && el.dataset.text!==undefined && t!==el.dataset.text){
    el.dataset.text=t; curText=t;
    fetch(`${BASE}/api/invocation/${curInv}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t})});
  }
});
// 快捷键
addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.isContentEditable) return;  // 输入/编辑中不触发快捷键
  const map={"1":"TERM","2":"Q_TRANSLATE","3":"A_TRANSLATE","4":"BRIDGE","5":"SUMMARY"};
  if(map[e.key]) invoke(map[e.key]);
  else if(e.key==="Enter") $("btnShow").click();
  else if(e.key==="Backspace") $("btnDiscard").click();
  else if(e.key==="r"||e.key==="R") $("btnRegen").click();
  else if(e.key==="Escape") $("btnKill").click();
});
// 健康检查（ASR 状态来自流水线真实连接）
setInterval(async()=>{ try{ const h=await fetch(BASE+"/api/health").then(r=>r.json());
  const a=h.asr;
  // 「无语音」与「推理失败」必须分开显示。后端已保证：推理失败时状态是 error（不再被
  // connected 覆盖），所以能走到下面「已连接 · 无语音」时，就真的是没有语音输入。
  if(a==="connected"){ $("asrDot").className="dot ok"; $("asrStatus").textContent="ASR: 已连接"+(h.asr_idle_sec>15?(" · 无语音 "+Math.round(h.asr_idle_sec)+"s"):""); }
  else if(a==="connecting"){ $("asrDot").className="dot warn"; $("asrStatus").textContent="ASR: 连接失败，重连中"+(h.asr_detail?" · "+h.asr_detail:""); }
  else if(a==="error"){
    $("asrDot").className="dot bad";
    const d=String(h.asr_detail||""), n=h.asr_infer_fail||0;
    // qwen3_http 的 error 是「推理失败」而非连接问题 —— 必须显示原因，
    // 否则和「有语音但识别不出字」无法区分（旧版两者都只显示「无语音」）。
    $("asrStatus").textContent=/^error:infer:/.test(d)
      ? ("ASR: 推理失败"+(n>1?(" 连续"+n+"次"):"")+" · "+d.replace(/^error:infer:/,"").slice(0,70))
      : "ASR: 连接中断，等待重连";
  }
  else if(a==="closed"){ $("asrDot").className="dot bad"; $("asrStatus").textContent="ASR: 已断开，等待重连"; }
  else if(a==="idle"){ $("asrDot").className="dot"; $("asrStatus").textContent="ASR: 未启动 · 点「开始 Session」"; }
  else { $("asrDot").className="dot warn"; $("asrStatus").textContent="ASR:"+a; }
  $("llmDot").className="dot "+(h.llm==="ok"?"ok":"warn");
  $("llmStatus").textContent="LLM:"+h.llm;
  if(h.capture==="browser"){ $("micStatus").textContent="收音:"+(h.mic==="connected"?"采集中（浏览器）":"等待浏览器连接"); }
  else if(h.capture==="mic"){ $("micStatus").textContent="收音: 服务器本机麦克风"; }
  else { $("micStatus").textContent="收音: 未启动"; } }catch(e){} },3000);
// ---- 浏览器收音（远端：浏览器麦克风 → /ws/audio → 服务器 ASR）----
let micOn=false, micCtx=null, micStream=null, micProc=null, micWs=null;
function downsample(buf,inRate,outRate){
  if(inRate===outRate) return buf;
  const ratio=inRate/outRate, n=Math.floor(buf.length/ratio), out=new Float32Array(n);
  let j=0;
  for(let i=0;i<n;i++){
    const end=Math.floor((i+1)*ratio); let sum=0,cnt=0;
    while(j<end&&j<buf.length){ sum+=buf[j++]; cnt++; }
    out[i]=cnt?sum/cnt:0;
  }
  return out;
}
// 由「开始 Session」自动调用（不再单独设按钮）。返回是否成功开启。
async function startMic(){
  if(micOn) return true;   // 已在采集：直接复用，避免开出第二条流把音频推重
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $("micStatus").textContent="收音: 浏览器不支持麦克风";
    $("sessionInfo").textContent="浏览器收音失败：非安全上下文，无法访问麦克风。请用 http://127.0.0.1:<端口> 访问（SSH 端口转发即可），或在 Chrome 把本地址设为可信（chrome://flags/#unsafely-treat-insecure-origin-as-secure）；也可取消勾选「浏览器收音」改用服务器声卡";
    return false;
  }
  try{ micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false}); }
  catch(e){
    $("micStatus").textContent="收音: 麦克风授权失败";
    $("sessionInfo").textContent="浏览器收音失败："+e.message+"（可在地址栏左侧重新允许麦克风，或取消勾选「浏览器收音」改用服务器声卡）";
    return false;
  }
  try{ micCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000}); }
  catch(e){ micCtx=new (window.AudioContext||window.webkitAudioContext)(); }
  const src=micCtx.createMediaStreamSource(micStream);
  micWs=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+BASE+"/ws/audio");
  micWs.onclose=ev=>{ if(micOn){ if(ev.code===4001) $("sessionInfo").textContent="服务器流水线未开启浏览器收音：请勾选「浏览器收音」后重新点「开始 Session」"; stopMic(); } };
  const rate=micCtx.sampleRate;
  micProc=micCtx.createScriptProcessor(2048,1,1);
  micProc.onaudioprocess=ev=>{
    if(!micWs||micWs.readyState!==1) return;
    let f32=ev.inputBuffer.getChannelData(0);
    if(rate!==16000) f32=downsample(f32,rate,16000);
    const i16=new Int16Array(f32.length);
    for(let i=0;i<f32.length;i++){ const s=Math.max(-1,Math.min(1,f32[i])); i16[i]=s<0?s*0x8000:s*0x7FFF; }
    micWs.send(i16.buffer);
  };
  src.connect(micProc);
  const mute=micCtx.createGain(); mute.gain.value=0;  // ScriptProcessor 需连 destination 才运转；增益置 0 防外放回声
  micProc.connect(mute); mute.connect(micCtx.destination);
  micOn=true;
  $("btnMicStop").style.display="";   // 采集期间才显示「停止收音」
  $("micStatus").textContent="收音: 采集中（浏览器）";
  return true;
}
function stopMic(){
  micOn=false;
  try{ if(micStream) micStream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ if(micProc) micProc.disconnect(); }catch(e){}
  try{ if(micCtx) micCtx.close(); }catch(e){}
  try{ if(micWs&&micWs.readyState===1) micWs.close(); }catch(e){}
  micStream=null; micProc=null; micCtx=null; micWs=null;
  $("btnMicStop").style.display="none";
  $("micStatus").textContent="收音: 已停止";
}
$("btnMicStop").onclick=stopMic;
// ---- 热词面板：查看/手动编辑/按人生成/参与开关 ----
async function loadHotwords(){
  try{ const h=await fetch(BASE+"/api/hotwords").then(r=>r.json());
    if(document.activeElement!==$("hwText")) $("hwText").value=Object.keys(h.words||{}).join("\n");
    $("hwEnabled").checked=h.enabled!==false;
  }catch(e){}
}
// ---- 上传讲稿：服务端解析正文 → 抽热词（即时用于 ASR）+ 生成浓缩摘要（AI 背景）----
$("docUpload").onclick=async()=>{
  const f=$("docFile").files[0];
  if(!f){ alert("请先选择演示稿文件"); return; }
  if(!sid){ alert("请先点「开始 Session」再上传讲稿"); return; }
  const fd=new FormData(); fd.append("file",f);
  $("hwStatus").textContent="解析中…";
  $("sessionInfo").textContent="正在解析 "+f.name+"（解析+抽取通常 1~2 分钟）…";
  try{
    const r=await fetch(BASE+"/api/materials/upload",{method:"POST",body:fd}).then(r=>r.json());
    if(r&&r.error){
      $("hwStatus").textContent="失败："+r.error;
      $("sessionInfo").textContent="讲稿解析失败："+r.error;
      return;
    }
    $("hwStatus").textContent="已抽 "+r.hotwords+" 个热词（新增 "+r.hotwords_new+"），摘要 "+r.digest_chars+" 字";
    $("sessionInfo").textContent=f.name+" 解析完成 · 正文 "+r.parsed_chars+" 字"
      +(r.truncated?"（超长已截断）":"")
      +" · 摘要 "+r.digest_chars+" 字已作为 AI 翻译背景"
      +(r.fields&&r.fields.length?(" · 方向："+r.fields.join("／")):"");
    loadHotwords();
  }catch(e){
    $("hwStatus").textContent="失败："+e.message;
    $("sessionInfo").textContent="讲稿上传失败："+e.message;
  }
};
$("hwSave").onclick=async()=>{
  const r=await fetch(BASE+"/api/hotwords",{method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text:$("hwText").value})}).then(r=>r.json()).catch(()=>null);
  $("hwStatus").textContent=r&&r.ok?("已保存 "+r.count+" 个热词，ASR 即时生效"):"保存失败";
};
$("hwEnabled").onchange=async()=>{
  const r=await post("/api/hotwords/toggle",{enabled:$("hwEnabled").checked});
  $("hwStatus").textContent=$("hwEnabled").checked?"热词已参与 ASR 调用":"热词已停用（ASR 不带热词）";
};
// ---- 目标学科：把 AI 输出翻译到该学科的表达层次（可输入下拉框，默认「白话」）----
// 目标学科：默认「白话」。默认值不预填进输入框 —— 由 placeholder 表达即可，
// 否则一进页面就看到框里写着「白话」，像已经选定了什么，反而突兀。
const DISCIPLINE_DEFAULT="白话";
async function loadTargetDiscipline(){
  const td=$("targetDiscipline"); if(!td) return;
  try{ const r=await fetch(BASE+"/api/target-discipline").then(r=>r.json());
    const v=(r&&r.discipline)||"";
    if(document.activeElement!==td) td.value=(v===DISCIPLINE_DEFAULT)?"":v;
  }catch(e){}
}
async function applyTargetDiscipline(){
  const td=$("targetDiscipline"); if(!td) return;
  const v=td.value.trim()||DISCIPLINE_DEFAULT;
  td.value=(v===DISCIPLINE_DEFAULT)?"":v;   // 回到默认就清空，交回 placeholder
  const r=await post("/api/target-discipline",{discipline:v}).catch(()=>null);
  $("sessionInfo").textContent=(r&&r.ok)?("目标学科："+r.discipline):"目标学科切换失败";
}
// 元素存在才绑定。将来若再漏加元素，最坏只丢这一个功能，不会连累后面的初始化（这正是上次
// 「卡在启动中」的成因：一行 null.onchange 抛错，把 connect() 一起带走了）
if($("targetDiscipline")){
  $("targetDiscipline").onchange=applyTargetDiscipline;
  $("targetDiscipline").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); applyTargetDiscipline(); } });
}
// 初始化：WS 已在文件开头建立；其余各自隔离，任一失败不影响其它
try{ loadHotwords(); }catch(e){ console.error(e); }
try{ loadTargetDiscipline(); }catch(e){ console.error(e); }
</script>
