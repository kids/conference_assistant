<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 翻译席 · 会场投屏</title>
<style>
  :root{ --bg:#0b0d10; --txt:#f2f4f7; --dim:#7d8792; --accent:#4c8dff; --green:#3fb950; --yellow:#d29922; --blue:#58a6ff; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{height:64px;display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid #1c2128;flex:0 0 auto}
  header .title{font-size:20px;font-weight:600}
  header .sub{color:var(--dim);font-size:14px}
  .sp{flex:1}
  .lamp{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--dim)}
  .lamp .d{width:14px;height:14px;border-radius:50%;background:#333}
  .lamp.listening .d{background:var(--green);box-shadow:0 0 12px var(--green)}
  .lamp.generating .d{background:var(--yellow);box-shadow:0 0 12px var(--yellow)}
  .lamp.showing .d{background:var(--blue);box-shadow:0 0 12px var(--blue)}
  #clock{font-family:monospace;font-size:20px;color:var(--dim)}
  /* AI 卡片区 */
  #aiArea{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 60px;position:relative}
  #aiCard{max-width:1000px;width:100%;text-align:center;opacity:0;transition:opacity .3s}
  #aiCard.visible{opacity:1}
  #badge{display:inline-block;background:var(--accent);color:#fff;font-size:15px;padding:6px 18px;border-radius:20px;margin-bottom:26px;letter-spacing:.05em}
  #aiText{font-size:52px;line-height:1.5;font-weight:600;white-space:pre-wrap}
  #watermark{position:absolute;top:16px;right:24px;font-size:13px;color:var(--dim)}
  /* 字幕区 */
  #subtitleArea{height:26%;border-top:1px solid #1c2128;padding:18px 28px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .subline{font-size:22px;line-height:1.5;color:var(--txt);margin-bottom:6px}
  .subline.draft{color:#6b7682;font-style:italic}
  /* 说话人标记：换人时缩进并加一条竖线，观众一眼看出换人（与操作台口径一致） */
  .subline .spk{color:var(--blue);font-size:17px;margin-right:12px}
  .subline.new-speaker{margin-top:10px;padding-left:14px;border-left:3px solid #2b3a4d}
</style>
</head>
<body>
<header>
  <span class="title" id="title">Workshop</span>
  <span class="sub" id="subtitle">AI 跨学科实时翻译席</span>
  <span class="sp"></span>
  <span class="lamp listening" id="lamp"><span class="d"></span><span id="lampText">静默听会</span></span>
  <span id="clock">00:00:00</span>
</header>
<div id="aiArea">
  <div id="watermark">AI 跨学科翻译尝试 · 待报告人确认</div>
  <div id="aiCard">
    <div id="badge">术语翻译</div>
    <div id="aiText"></div>
  </div>
</div>
<div id="subtitleArea"></div>
<script>
const $=id=>document.getElementById(id);
// 部署可能挂在路径前缀下（如腾讯云 Kong 网关的 base path /conf）。
// 页面固定是 <前缀>/screen，从 pathname 反推前缀 —— 根路径部署时为空串。
const BASE=location.pathname.replace(/\/(console|screen)\/?$/,"").replace(/\/+$/,"");
let ws, start=Date.now(), aiTimer=null, lastState="IDLE";
const TASK_LABEL={TERM:"术语翻译",Q_TRANSLATE:"问题转译",A_TRANSLATE:"回答转译",BRIDGE:"桥接提问",SUMMARY:"报告总结",SPEECH:"发言稿"};
// 角标：发言稿是「AI 起草、供发言人本人使用」，与「AI 翻译尝试」不是一回事，必须区分
const WATERMARK_TRANSLATE="AI 跨学科翻译尝试 · 待报告人确认";
const WATERMARK_SPEECH="AI 起草发言稿 · 供发言人修改使用";

function connect(){
  // 协议自适应（页面走 https 时必须 wss）+ 带上路径前缀
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+BASE+"/ws/screen");
  ws.onmessage=e=>handle(JSON.parse(e.data));
  ws.onclose=()=>setTimeout(connect,1000);
}
function setLamp(state,txt){ $("lamp").className="lamp "+state.toLowerCase(); $("lampText").textContent=txt; }
function handle(m){
  switch(m.type){
    case "SESSION": $("title").textContent=m.title; break;
    case "TRANSCRIPT_PARTIAL": addSub(m.text,true); break;
    case "TRANSCRIPT_FINAL": addSub(m.text,false,m.seg_id); break;
    case "TRANSCRIPT_REVISED": reviseSub(m.seg_id,m.text); break;
    case "SPEAKER_ASSIGNED": markSubSpeaker(m.seg_id,m.label||m.speaker); break;
    case "AI_STATE":
      // 发言稿的生成过程不占大屏：只在操作员点「投屏」时才通过 AI_SHOWING 上来
      if(m.task==="SPEECH") break;
      if(m.state==="GENERATING"){ window.__cur=""; setLamp("generating","生成中"); $("aiCard").classList.remove("visible"); }
      // IDLE 也要下屏：丢弃/生成失败都会发 IDLE，此前只改状态灯会让卡片继续留在屏上
      else if(m.state==="IDLE"){ setLamp("listening","静默听会"); clearTimeout(aiTimer); $("aiCard").classList.remove("visible"); }
      else if(m.state==="PENDING_APPROVAL"){ setLamp("generating","待确认"); }
      break;
    case "AI_DELTA": /* 实时拼接暂存 */ if(m.task!=="SPEECH") window.__cur=(window.__cur||"")+m.delta; break;
    case "AI_READY": if(m.task!=="SPEECH") window.__cur=m.text; break;
    case "AI_SHOWING":
      const text=m.text||window.__cur||"";
      $("aiText").textContent=text;
      $("badge").textContent=TASK_LABEL[m.task]||"AI 翻译";
      $("watermark").textContent=(m.task==="SPEECH")?WATERMARK_SPEECH:WATERMARK_TRANSLATE;
      $("aiCard").classList.add("visible");
      setLamp("showing","展示中");
      clearTimeout(aiTimer);
      // 发言稿是给人念的，留屏时间给足（默认 2 分钟，可用 TASK_LABEL 外的场景微调）
      aiTimer=setTimeout(()=>{ $("aiCard").classList.remove("visible"); setLamp("listening","静默听会"); }, (m.task==="SPEECH")?120000:30000);
      break;
    case "AI_KILLED":
      $("aiCard").classList.remove("visible"); setLamp("listening","静默听会"); clearTimeout(aiTimer);
      break;
  }
}
// 说话人标记迟到（先出字幕、后判说话人）：补到对应字幕行上；已滚出屏幕的行忽略。
// 与上一条不同人时加竖线缩进，形成"换行 + 标记"的视觉分段。
function markSubSpeaker(segId,label){
  const el=document.getElementById("sub-"+segId);
  if(!el||!label||el.querySelector(".spk")) return;
  el.dataset.spk=label;
  el.insertAdjacentHTML("afterbegin",`<span class="spk">${label}</span>`);
  const prev=el.previousElementSibling;
  if(prev&&prev.dataset.spk&&prev.dataset.spk===label) el.classList.remove("new-speaker");
  else el.classList.add("new-speaker");
}
function addSub(text,draft,segId){
  const area=$("subtitleArea");
  if(draft){
    // 草稿：更新或新增一条草稿行
    const last=area.lastElementChild;
    if(last && last.classList.contains("draft")){ last.textContent=text; }
    else{ const d=document.createElement("div"); d.className="subline draft"; d.textContent=text; area.appendChild(d); }
  }else{
    // 终稿：清空草稿行 + 新增终稿行（带 seg_id 以便后续修正覆盖）
    const dr=area.querySelector(".draft"); if(dr) dr.remove();
    const d=document.createElement("div"); d.className="subline"; d.textContent=text;
    if(segId) d.id="sub-"+segId;
    area.appendChild(d);
  }
  while(area.children.length>4) area.removeChild(area.firstChild);
}
function reviseSub(segId,text){
  // 回退修正 / LLM 改写：覆盖更新对应字幕行（若已滚出屏幕则忽略）
  const el=document.getElementById("sub-"+segId);
  if(el) el.textContent=text;
}
setInterval(()=>{ const s=Math.floor((Date.now()-start)/1000);
  $("clock").textContent=`${String(Math.floor(s/3600)).padStart(2,"0")}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; },1000);
connect();
</script>
</body>
</html>
